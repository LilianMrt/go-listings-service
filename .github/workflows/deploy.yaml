name: Deploy

# Runs on every push to main (and on demand). The jobs are chained with
# `needs`, so the graph is a single linear flow you can watch finish:
#   test  ->  build & push image (GHCR)  ->  deploy to VPS
# The image is never pushed and the VPS is never touched unless tests pass.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  test:
    name: test (build, vet, lint, integration)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2

      # ubuntu-latest ships Docker, which testcontainers needs for the
      # Postgres + Kafka integration tests.
      - name: Tests (unit + integration)
        run: go test -race ./...

  build-push:
    name: build & push image to GHCR
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/lilianmrt/go-listings-service:latest
            ghcr.io/lilianmrt/go-listings-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: deploy to VPS
    needs: build-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          echo "${{ secrets.VPS_HOST_KEY }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Copy compose file to VPS
        run: |
          scp -i ~/.ssh/id_deploy -P ${{ secrets.VPS_SSH_PORT }} \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            compose.prod.yaml \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/go-listings-service/compose.prod.yaml"

      - name: Deploy on VPS
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          ssh -i ~/.ssh/id_deploy -p ${{ secrets.VPS_SSH_PORT }} \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" bash -s <<EOF
          set -euo pipefail
          cd /opt/go-listings-service
          umask 077
          # Pin the image to this exact commit so the deploy is reproducible.
          printf 'POSTGRES_PASSWORD=%s\nIMAGE=ghcr.io/lilianmrt/go-listings-service:%s\n' \
            '${POSTGRES_PASSWORD}' '${{ github.sha }}' > .env
          # Migrations run automatically on app startup (no separate init step).
          docker compose -f compose.prod.yaml pull
          docker compose -f compose.prod.yaml up -d --wait
          docker image prune -f
          EOF
